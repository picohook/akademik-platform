# Use with docker-compose.prod.yml; start only db/web, never caddy.
#
# Trap worth knowing about: `image:` pins the image name. `pull_policy: never`
# plus a pinned name means `docker compose up --build` BUILDS the new image but
# KEEPS RUNNING the old one unless the names match. This caused the 2026-10-26
# v131 incident: the default was `akademik-platform:libedge-r2`, so a freshly
# built libedge-v131 never took over and `--force-recreate` did not help (it
# recreates the container, not the image). Keep this default in sync with the
# version you actually build, or set LIBEDGE_IMAGE explicitly.
#
# No `networks:` block here on purpose. docker-compose.prod.yml sets
# `name: akademik-platform-prod`, so the project's default network IS
# akademik-platform-prod_default, and db + web already share it. Adding an
# explicit external network here gains nothing and only attaches web to a
# second network (verified with `docker compose config` on 2026-10-27).
services:
  web:
    image: ${LIBEDGE_IMAGE:-libedge-v131}
    pull_policy: never
    env_file:
      - .env.r2
    ports:
      - "127.0.0.1:3001:3000"
