name: akademik-platform-prod

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./db/migrations:/migrations:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: ./spike/app
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      LIBEDGE_ADMIN_TOKEN: ${LIBEDGE_ADMIN_TOKEN:-}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      BRAND_NAME: ${BRAND_NAME:-Akademik Platform}
      BRAND_TAGLINE: ${BRAND_TAGLINE:-}
      APP_VERSION: ${APP_VERSION:-123}
      BUILD_SHA: ${BUILD_SHA:-}
      BUILD_DATE: ${BUILD_DATE:-}
      APP_ENV: ${APP_ENV:-production}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      SOCIAL_DRM_B2B: ${SOCIAL_DRM_B2B:-true}
      ANNOTATION_RECEIPT_RETENTION_DAYS: ${ANNOTATION_RECEIPT_RETENTION_DAYS:-90}
      ANNOTATION_TOMBSTONE_RETENTION_DAYS: ${ANNOTATION_TOMBSTONE_RETENTION_DAYS:-365}
      DEMO_TENANT_ID: ${DEMO_TENANT_ID:-11111111-1111-1111-1111-111111111111}
      DEMO_USER_ID: ${DEMO_USER_ID:-22222222-2222-2222-2222-222222222222}
      PORT: 3000
    expose:
      - "3000"
    volumes:
      - ./data/uploads:/app/public/uploads
      - ./data/ocr:/app/public/ocr
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
